<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema — Força-Tarefa Rede de Escolas | COINF</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0B2A66 0%, #034991 55%, #0A66C2 100%);
      padding: 20px;
      color: #14202E;
    }

    .card-login {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(7, 25, 62, 0.35);
      padding: 36px 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .cabecalho {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge-orgao {
      display: inline-block;
      background: #E6EEF7;
      color: #034991;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .cabecalho h1 {
      font-size: 21px;
      font-weight: 700;
      color: #0B2A66;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .cabecalho p {
      font-size: 13px;
      color: #5A6B7C;
    }

    .alerta-erro {
      display: none;
      background: #FEF2F2;
      color: #B91C1C;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      text-align: center;
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #243447;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      font-size: 14px;
      color: #14202E;
      background: #F8FAFC;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .campo input:focus {
      outline: none;
      border-color: #034991;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(3, 73, 145, 0.14);
    }

    .senha-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .senha-wrap input {
      padding-right: 76px;
    }

    .toggle-senha {
      position: absolute;
      right: 10px;
      border: none;
      background: transparent;
      color: #034991;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .toggle-senha:hover {
      background: #E6EEF7;
    }

    .entrar {
      width: 100%;
      height: 46px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: #034991;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .entrar:hover:not(:disabled) {
      background: #0B2A66;
    }

    .entrar:active:not(:disabled) {
      transform: scale(0.99);
    }

    .entrar:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .rodape {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #E2E8F0;
      text-align: center;
      font-size: 12px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card-login">
    <div class="cabecalho">
      <span class="badge-orgao">SEC-BA • COINF</span>
      <h1>Força-Tarefa Rede de Escolas</h1>
      <p>Identifique-se com suas credenciais institucionais</p>
    </div>

    <div class="alerta-erro" id="msg-erro"></div>

    <form id="form-login">
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu.nome@educacao.ba.gov.br" required autocomplete="email">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha-wrap">
          <input id="senha" type="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-senha" id="btn-ver">Mostrar</button>
        </div>
      </div>

      <button type="submit" class="entrar" id="btn-entrar">Entrar no sistema</button>
    </form>

    <div class="rodape">
      Coordenação de Infraestrutura da Rede Física Escolar
    </div>
  </div>

  <script>
    const btnVer = document.getElementById('btn-ver');
    const inputSenha = document.getElementById('senha');

    btnVer.addEventListener('click', () => {
      const oculta = inputSenha.type === 'password';
      inputSenha.type = oculta ? 'text' : 'password';
      btnVer.textContent = oculta ? 'Ocultar' : 'Mostrar';
    });

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('msg-erro');
      const btn = document.getElementById('btn-entrar');

      erroEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            senha: inputSenha.value
          })
        });

        const dados = await resp.json();
        if (!resp.ok) {
          throw new Error(dados.detail || 'Não foi possível entrar.');
        }

        // Redireciona forçando nova requisição sem cache do navegador
        window.location.replace('/?t=' + Date.now());
      } catch (err) {
        erroEl.textContent = err.message;
        erroEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar no sistema';
      }
    });
  </script>
</body>
</html>
