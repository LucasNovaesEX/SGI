<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Força-tarefa Rede de Escolas - COINF</title>
  <style>
    :root {
      --primaria: #034991;
      --primaria-escura: #02366d;
      --texto: #14202E;
      --texto-suave: #556372;
      --borda: #D7DEE7;
      --erro: #B91C1C;
      --erro-fundo: #FEF2F2;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--texto);
      background:
        radial-gradient(circle at 15% 20%, #BFD6F6 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, #BDEBEC 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, #DCD9F7 0%, transparent 50%),
        linear-gradient(135deg, #F4F7FD 0%, #E6EEFB 100%);
    }
    .card {
      width: 100%;
      max-width: 410px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 45px rgba(11, 42, 102, 0.10);
    }
    .badge {
      display: inline-block;
      background: #E6EEF7;
      color: var(--primaria);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      color: #0B2A66;
      line-height: 1.25;
    }
    p.sub {
      margin: 0 0 24px 0;
      font-size: 14px;
      color: var(--texto-suave);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--texto);
    }
    .campo { margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--primaria); }
    .senha-wrap { position: relative; }
    .senha-wrap input { padding-right: 72px; }
    .toggle-senha {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--primaria);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    button.entrar {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: var(--primaria);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button.entrar:hover { background: var(--primaria-escura); }
    button.entrar:disabled { opacity: 0.65; cursor: wait; }
    .erro {
      display: none;
      background: var(--erro-fundo);
      color: var(--erro);
      border: 1px solid #FECACA;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">COINF • Acesso Restrito</span>
    <h1>Força-tarefa Rede de Escolas</h1>
    <p class="sub">Entre com seu e-mail e senha cadastrados pela coordenação.</p>

    <div id="msg-erro" class="erro"></div>

    <form id="form-login">
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu.nome@educacao.ba.gov.br" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha-wrap">
          <input id="senha" type="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-senha" id="btn-ver">Mostrar</button>
        </div>
      </div>
      <button type="submit" class="entrar" id="btn-entrar">Entrar no sistema</button>
    </form>
  </div>

  <script>
    const btnVer = document.getElementById('btn-ver');
    const inputSenha = document.getElementById('senha');
    btnVer.addEventListener('click', () => {
      const oculta = inputSenha.type === 'password';
      inputSenha.type = oculta ? 'text' : 'password';
      btnVer.textContent = oculta ? 'Ocultar' : 'Mostrar';
    });

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('msg-erro');
      const btn = document.getElementById('btn-entrar');
      erroEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            senha: inputSenha.value
          })
        });
        const dados = await resp.json();
        if (!resp.ok) {
          throw new Error(dados.detail || 'Não foi possível entrar.');
        }
        window.location.href = '/';
      } catch (err) {
        erroEl.textContent = err.message;
        erroEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar no sistema';
      }
    });
  </script>
</body>
</html>
